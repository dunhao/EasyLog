<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyLog · 日志检索</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
<script src="assets/mock.js"></script>
<script src="assets/charts.js"></script>
<script>
function showToast(msg, type) {
  type = type || 'success';
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay show';
  overlay.style.alignItems = 'flex-start';
  overlay.style.paddingTop = '80px';
  overlay.style.pointerEvents = 'none';
  overlay.style.background = 'transparent';
  overlay.style.backdropFilter = 'none';
  var color = type === 'success' ? 'var(--success)' : 'var(--danger)';
  var icon = type === 'success' ? 'check-circle' : 'alert-circle';
  overlay.innerHTML =
    '<div style="background:var(--bg-elevated);border:1px solid ' + color + ';border-radius:var(--radius-md);padding:12px 20px;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:10px;font-size:var(--text-sm);">' +
      '<i data-lucide="' + icon + '" style="color:' + color + ';width:18px;height:18px;"></i>' +
      '<span>' + msg + '</span>' +
    '</div>';
  document.body.appendChild(overlay);
  lucide.createIcons();
  setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 2000);
}

EasyLogUI.render({
  activeNavKey: 'search',
  pageTitle: '日志检索',
  breadcrumbHTML: '<a href="index.html">EasyLog</a><span class="breadcrumb-sep">/</span><span>日志管理</span><span class="breadcrumb-sep">/</span><span>日志检索</span>',
  actionsHTML: '<span class="text-xs text-muted">实时检索 · 最大返回 10000 条</span>',
  mainHTML:
    '<div class="search-layout">' +
      // Sidebar
      '<aside class="search-sidebar">' +
        '<div class="filter-section">' +
          '<h4>主题</h4>' +
          '<select class="form-select" id="f-topic" style="width:100%;">' +
            '<option value="">全部主题</option>' +
          '</select>' +
        '</div>' +
        '<div class="filter-section">' +
          '<h4>时间范围</h4>' +
          '<div class="flex flex-col gap-2">' +
            '<label class="filter-item"><input type="radio" name="time" value="5min" /> <span>近 5 分钟</span></label>' +
            '<label class="filter-item"><input type="radio" name="time" value="1h" /> <span>近 1 小时</span></label>' +
            '<label class="filter-item"><input type="radio" name="time" value="6h" checked /> <span>近 6 小时</span></label>' +
            '<label class="filter-item"><input type="radio" name="time" value="24h" /> <span>近 24 小时</span></label>' +
            '<label class="filter-item"><input type="radio" name="time" value="7d" /> <span>近 7 天</span></label>' +
            '<label class="filter-item"><input type="radio" name="time" value="custom" /> <span>自定义</span></label>' +
          '</div>' +
        '</div>' +
        '<div class="filter-section">' +
          '<h4>日志级别</h4>' +
          '<div class="flex flex-col gap-2">' +
            '<label class="filter-item"><input type="checkbox" name="level" value="DEBUG" /> <span class="lvl lvl-DEBUG">DEBUG</span></label>' +
            '<label class="filter-item"><input type="checkbox" name="level" value="INFO" checked /> <span class="lvl lvl-INFO">INFO</span></label>' +
            '<label class="filter-item"><input type="checkbox" name="level" value="WARN" checked /> <span class="lvl lvl-WARN">WARN</span></label>' +
            '<label class="filter-item"><input type="checkbox" name="level" value="ERROR" checked /> <span class="lvl lvl-ERROR">ERROR</span></label>' +
            '<label class="filter-item"><input type="checkbox" name="level" value="FATAL" /> <span class="lvl lvl-FATAL">FATAL</span></label>' +
            '<label class="filter-item"><input type="checkbox" name="level" value="TRACE" /> <span class="lvl lvl-TRACE">TRACE</span></label>' +
          '</div>' +
        '</div>' +
        '<div class="filter-section">' +
          '<h4>服务</h4>' +
          '<div id="f-services" class="flex flex-col gap-2"></div>' +
        '</div>' +
        '<div class="filter-section">' +
          '<h4>请求 ID</h4>' +
          '<input type="text" class="form-input" id="f-reqid" placeholder="req_a8f3k2" style="font-family:var(--font-mono);" />' +
        '</div>' +
        '<button class="btn btn-primary btn-sm w-full" id="f-apply"><i data-lucide="filter"></i>应用筛选</button>' +
      '</aside>' +
      // Main area
      '<section class="flex flex-col gap-3">' +
        // Query bar
        '<div class="log-query-bar">' +
          '<i data-lucide="search" style="color:var(--text-muted);margin-left:6px;width:16px;height:16px;"></i>' +
          '<input type="text" class="log-query-input" id="q-input" placeholder="level:ERROR AND service:order-service" value="" />' +
          '<span class="text-xs text-muted" id="q-time-range">近 6 小时 · 14:00 ~ 14:32</span>' +
          '<button class="btn btn-primary btn-sm" id="q-search"><i data-lucide="search"></i>搜索</button>' +
        '</div>' +
        // Histogram
        '<div class="card" style="padding:12px;">' +
          '<div class="flex items-center justify-between mb-2">' +
            '<div class="text-sm text-secondary">时间分布直方图</div>' +
            '<div class="text-xs text-muted">按级别堆叠 · log scale</div>' +
          '</div>' +
          '<div id="chart-histogram" style="width:100%;height:200px;"></div>' +
        '</div>' +
        // Result toolbar
        '<div class="flex items-center justify-between">' +
          '<div class="text-sm">共 <span id="result-count" style="font-weight:600;color:var(--accent-primary);">0</span> 条结果 <span class="text-muted" id="result-time">（耗时 0ms）</span></div>' +
          '<div class="flex gap-2">' +
            '<button class="btn btn-secondary btn-sm" id="q-refresh"><i data-lucide="refresh-cw"></i>刷新</button>' +
            '<button class="btn btn-secondary btn-sm" id="q-export"><i data-lucide="download"></i>导出</button>' +
          '</div>' +
        '</div>' +
        // Log list
        '<div class="card" style="padding:0;overflow:hidden;">' +
          '<div id="log-list">' +
            '<div class="empty-state"><i data-lucide="search"></i><h3>输入查询条件后点击搜索</h3><div class="text-xs text-muted">支持 level:ERROR、service:xxx 等语法</div></div>' +
          '</div>' +
        '</div>' +
      '</section>' +
    '</div>'
});

// Histogram data (24 hourly buckets)
var histBuckets = [];
var now = new Date();
for (var i = 23; i >= 0; i--) {
  var d = new Date(now.getTime() - i * 3600 * 1000);
  histBuckets.push(String(d.getHours()).padStart(2, '0') + ':00');
}
var histSeries = {
  INFO: histBuckets.map(function (_, i) { return Math.round(80 + Math.sin(i / 3) * 40 + Math.random() * 30); }),
  ERROR: histBuckets.map(function (_, i) { return Math.round(15 + Math.sin(i / 2) * 10 + Math.random() * 8); }),
  WARN: histBuckets.map(function (_, i) { return Math.round(20 + Math.cos(i / 2.5) * 12 + Math.random() * 6); }),
  DEBUG: histBuckets.map(function () { return Math.round(30 + Math.random() * 20); }),
  FATAL: histBuckets.map(function () { return Math.random() > 0.6 ? Math.round(Math.random() * 4) : 0; })
};
EasyLogCharts.histogramChart(document.getElementById('chart-histogram'), {
  labels: histBuckets,
  series: histSeries
});

// Services filter (distinct from logs)
var allServices = [];
var seen = {};
MockData.logs.forEach(function (l) { if (!seen[l.service]) { seen[l.service] = 1; allServices.push(l.service); } });
allServices.sort();
document.getElementById('f-services').innerHTML = allServices.map(function (s) {
  return '<label class="filter-item"><input type="checkbox" name="service" value="' + s + '" /> <span class="text-sm">' + s + '</span></label>';
}).join('');

// Topic dropdown
MockAPI.listTopics().then(function (topics) {
  var sel = document.getElementById('f-topic');
  topics.forEach(function (t) {
    var opt = document.createElement('option');
    opt.value = t.uuid;
    opt.textContent = t.name;
    sel.appendChild(opt);
  });
  lucide.createIcons();
});

// Time range display
document.querySelectorAll('input[name=time]').forEach(function (r) {
  r.addEventListener('change', function () {
    var map = { '5min': '近 5 分钟', '1h': '近 1 小时', '6h': '近 6 小时', '24h': '近 24 小时', '7d': '近 7 天', 'custom': '自定义' };
    document.getElementById('q-time-range').textContent = map[r.value] + ' · 14:00 ~ 14:32';
  });
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function renderLogList(logs, elapsed) {
  document.getElementById('result-count').textContent = logs.length;
  document.getElementById('result-time').textContent = '（耗时 ' + elapsed + 'ms）';
  var list = document.getElementById('log-list');
  if (!logs.length) {
    list.innerHTML = '<div class="empty-state"><i data-lucide="inbox"></i><h3>无匹配日志</h3><div class="text-xs text-muted">尝试调整查询条件或时间范围</div></div>';
    lucide.createIcons();
    return;
  }
  list.innerHTML = logs.map(function (l, idx) {
    var extraBadges = '';
    try {
      var obj = JSON.parse(l.extra);
      extraBadges = Object.keys(obj).map(function (k) {
        return '<span class="badge badge-muted">' + escapeHtml(k) + ': ' + escapeHtml(String(obj[k])) + '</span>';
      }).join(' ');
    } catch (e) {
      extraBadges = '<span class="badge badge-muted">' + escapeHtml(l.extra) + '</span>';
    }
    return '<div class="log-entry-wrap">' +
      '<div class="log-entry" onclick="toggleDetail(' + idx + ')" style="cursor:pointer;">' +
        '<span class="log-ts">' + escapeHtml(l.ts) + '</span>' +
        '<span class="lvl lvl-' + l.level + '">' + l.level + '</span>' +
        '<span class="log-msg">' + escapeHtml(l.msg) + '<span class="log-service" style="margin-left:8px;">[' + escapeHtml(l.service) + ']</span></span>' +
        '<span class="cell-mono cell-muted">' + escapeHtml(l.host) + '</span>' +
      '</div>' +
      '<div class="log-detail" id="detail-' + idx + '" style="display:none;padding:12px 16px;background:var(--bg-elevated);border-bottom:1px solid var(--border-subtle);">' +
        '<div class="flex gap-4 mb-3" style="flex-wrap:wrap;">' +
          '<div><span class="text-xs text-muted">request_id: </span><span class="cell-mono">' + escapeHtml(l.request_id) + '</span></div>' +
          '<div><span class="text-xs text-muted">host: </span><span class="cell-mono">' + escapeHtml(l.host) + '</span></div>' +
          '<div><span class="text-xs text-muted">service: </span><span class="cell-mono">' + escapeHtml(l.service) + '</span></div>' +
        '</div>' +
        '<div class="text-xs text-muted mb-2">Extra 字段：</div>' +
        '<div class="flex gap-3 mb-3" style="flex-wrap:wrap;">' + extraBadges + '</div>' +
        '<div class="text-xs text-muted mb-2">完整 JSON：</div>' +
        '<pre class="code-block">' + escapeHtml(JSON.stringify(l, null, 2)) + '</pre>' +
      '</div>' +
    '</div>';
  }).join('');
  lucide.createIcons();
}

window.toggleDetail = function (i) {
  var d = document.getElementById('detail-' + i);
  if (d) d.style.display = d.style.display === 'none' ? 'block' : 'none';
};

async function doSearch() {
  var t0 = performance.now();
  var rawQuery = document.getElementById('q-input').value.trim();
  var query = '*';
  var levelFilter = null;
  var serviceFilter = null;
  if (rawQuery) {
    var parts = rawQuery.split(/\s+AND\s+|\s+and\s+/);
    var textParts = [];
    parts.forEach(function (p) {
      var m = p.match(/level:(\w+)/i);
      var sm = p.match(/service:(\S+)/i);
      if (m) levelFilter = m[1].toUpperCase();
      else if (sm) serviceFilter = sm[1];
      else if (p.trim()) textParts.push(p.trim());
    });
    query = textParts.join(' ').trim() || '*';
  }
  var checkedLevels = Array.prototype.map.call(
    document.querySelectorAll('input[name=level]:checked'), function (c) { return c.value; }
  );
  var checkedServices = Array.prototype.map.call(
    document.querySelectorAll('input[name=service]:checked'), function (c) { return c.value; }
  );
  var reqId = document.getElementById('f-reqid').value.trim();
  var effLevels = levelFilter ? [levelFilter] : checkedLevels;

  var logs = await MockAPI.searchLogs(query, 'ALL', 200);
  if (effLevels.length) logs = logs.filter(function (l) { return effLevels.indexOf(l.level) >= 0; });
  if (serviceFilter) logs = logs.filter(function (l) { return l.service === serviceFilter; });
  if (checkedServices.length) logs = logs.filter(function (l) { return checkedServices.indexOf(l.service) >= 0; });
  if (reqId) logs = logs.filter(function (l) { return l.request_id.indexOf(reqId) >= 0; });
  var elapsed = Math.round(performance.now() - t0);
  renderLogList(logs, elapsed);
}

document.getElementById('q-search').addEventListener('click', doSearch);
document.getElementById('q-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
document.getElementById('q-refresh').addEventListener('click', doSearch);
document.getElementById('q-export').addEventListener('click', function () { showToast('已导出为 CSV（原型模拟）'); });
document.getElementById('f-apply').addEventListener('click', doSearch);

doSearch();
</script>
</body>
</html>
