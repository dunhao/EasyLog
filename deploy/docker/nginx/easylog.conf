upstream easylog_query {
    server query:9515;
}

upstream easylog_ingest {
    server ingestion:9514;
}

upstream easylog_admin {
    server admin:9515;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 查询 API（管理控制台使用）
    location /api/v1/ {
        proxy_pass http://easylog_query;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 日志写入 API（业务方推送）
    location /api/v1/ingest {
        proxy_pass http://easylog_ingest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
